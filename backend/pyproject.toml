[project]
name = "ragnarok-api"
version = "0.1.0"
description = "RAGnarok backend - FastAPI service and RAG pipeline"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "NodeDotAI" }]

dependencies = [
    # --- web ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.17",
    "email-validator>=2.2",

    # --- persistence ---
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",

    # --- configuration & logging ---
    "pydantic-settings>=2.6",
    "structlog>=24.4",

    # --- providers ---
    "httpx>=0.28",
    "sentence-transformers>=3.3",
    # Declared directly so the CPU-only index below applies. PyPI's Linux torch
    # wheels bundle the CUDA stack, which would add several GB to the image.
    "torch>=2.2",

    # --- parsing ---
    "pypdf>=5.1",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",

    # --- auth ---
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-beautifulsoup4>=4.12",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# The local `alembic/` migration directory would otherwise be detected as
# first-party and clash with the installed `alembic` package.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses function calls as default values (Depends(), Query(), ...).
# B008 must not flag them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires a running Postgres instance",
    "slow: takes more than a few seconds",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
